<svg width="70" height="240" viewBox="0 0 70 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Vine stem: two gentle S-curves, seamless when tiled vertically -->
  <path d="M35 0 C 18 25, 52 55, 35 80 C 18 105, 52 135, 35 160 C 18 185, 52 215, 35 240"
        fill="none" stroke="#E75480" stroke-width="1.3" opacity="0.32" stroke-linecap="round"/>

  <!-- Leaves along the stem -->
  <ellipse cx="22" cy="38" rx="9" ry="4" transform="rotate(-35 22 38)" fill="#E75480" opacity="0.22"/>
  <ellipse cx="48" cy="98" rx="9" ry="4" transform="rotate(35 48 98)" fill="#E75480" opacity="0.22"/>
  <ellipse cx="22" cy="158" rx="9" ry="4" transform="rotate(-35 22 158)" fill="#E75480" opacity="0.22"/>
  <ellipse cx="48" cy="218" rx="9" ry="4" transform="rotate(35 48 218)" fill="#E75480" opacity="0.22"/>

  <!-- Small five-petal blossoms -->
  <g transform="translate(35,60)">
    <circle r="3.2" cx="0" cy="-6.2" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="5.9" cy="-1.9" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="3.6" cy="5.0" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="-3.6" cy="5.0" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="-5.9" cy="-1.9" fill="#E75480" opacity="0.34"/>
    <circle r="1.6" cx="0" cy="0" fill="#14161A" opacity="0.28"/>
  </g>
  <g transform="translate(35,180)">
    <circle r="3.2" cx="0" cy="-6.2" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="5.9" cy="-1.9" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="3.6" cy="5.0" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="-3.6" cy="5.0" fill="#E75480" opacity="0.34"/>
    <circle r="3.2" cx="-5.9" cy="-1.9" fill="#E75480" opacity="0.34"/>
    <circle r="1.6" cx="0" cy="0" fill="#14161A" opacity="0.28"/>
  </g>
</svg>
